<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>{{ title }} | {{ site.title }}</title>
<meta name="description" content="{{ description | default: site.description }}">

<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/lobbySketch.png">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description | default: site.description }}">
<meta name="twitter:creator" content="{{ site.author }}">
<meta property="twitter:image" content="{{ site.url }}/assets/lobbySketch.png">
<meta property="twitter:image:alt" content="Let's all go to the lobby, and draft some NDAs!">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/assets/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFA400">
<link rel="stylesheet" href="/css/main.css">
