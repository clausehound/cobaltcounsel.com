# DigitalOcean App Platform spec. Deploys on every push to master.
# Apply: doctl apps create --spec .do/app.yaml  (or: doctl apps update <id> --spec .do/app.yaml)
# DNS stays at GoDaddy: www CNAME -> <app>.ondigitalocean.app, apex forwarded to https://www.cobaltcounsel.com
name: cobaltcounsel-com
region: tor
domains:
  - domain: www.cobaltcounsel.com
    type: PRIMARY
static_sites:
  - name: site
    github:
      repo: clausehound/cobaltcounsel.com
      branch: master
      deploy_on_push: true
    dockerfile_path: Dockerfile
    output_dir: /app/public
    error_document: 404.html
